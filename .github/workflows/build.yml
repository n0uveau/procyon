name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc14
            os: ubuntu-latest
          - name: windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 \
            libxrandr-dev libxcursor-dev libxi-dev libudev-dev \
            libgl1-mesa-dev libfreetype-dev libharfbuzz-dev
          echo "CC=gcc-14"  >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Cache SFML build
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: sfml-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: sfml-${{ runner.os }}-

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DPROCYON_WERROR=ON

      - name: Build
        run: cmake --build build --config Release --parallel
